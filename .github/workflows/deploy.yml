name: Deploy to Server

# 推送 main 自动部署；也可以在 Actions 页面手动 Run workflow。
#
# 具体逻辑全部在服务器上的 scripts/deploy.sh 里（与手动部署共用一套）：
#   - 自动切到 admin 用户（node / pm2 只装在 admin 名下）
#   - flock 加锁，避免自动部署与手动部署并发
#   - 不执行 git reset --hard；依赖只在 package-lock 变化时重装
#   - 前端构建失败自动回滚上一版产物，不重启进程
#
# 2026-11-04 修复记录：原脚本用 root SSH 直连，root 环境没有 nvm/pm2，
# 且每次 rm -rf node_modules 后重装，和手动部署撞车时会清空依赖。
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 同一分支同时只跑一个部署，后推的排队而不是并行
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Run deploy script on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            bash /www/wwwroot/blog-website/scripts/deploy.sh
